# =============================================
# SVPMS - Smart Vendor Procurement Management
# =============================================
server.port=8081
server.servlet.context-path=/api
spring.application.name=svpms

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/svpms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=newpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=SVPMSInfosysSecretKey2026ForJWTSigning256BitsMinimumLength!!@@##
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.enabled=false

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
file.upload-dir=./uploads

# Logging
logging.level.com.infosys.svpms=DEBUG
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{20} - %msg%n

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Scheduler
scheduler.rfq.close-cron=0 0 * * * *
scheduler.compliance.check-cron=0 0 8 * * *
compliance.expiry.warning.days=30

# US 11: RFQ Auto-Closure Configuration
# Grace period allows submissions slightly after deadline before auto-closure
# Set to 0 for immediate closure (default)
# Example: Set to 30 for 30-minute grace period
rfq.closure.grace-period-minutes=0

# US 14: Audit log retention policy
# Records older than retention-days are purged daily by AuditRetentionScheduler.
# The purge itself is recorded as an AUDIT_RETENTION_PURGE entry.
app.audit.retention-days=365
app.audit.retention-cron=0 0 3 * * *

# US 13 AC #8: Notification retention policy
# Notifications older than retention-days are purged daily
# Set to 0 to disable automatic purging (retain forever)
app.notification.retention-days=365
app.notification.retention-cron=0 0 4 * * *

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:3001

# Cache
spring.cache.type=simple
